name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installieren
        run: npm ci

      - name: Stream-Deck-Abhängigkeiten
        run: npm install --prefix streamdeck/com.freakitout.d2tool.sdPlugin --no-audit --no-fund

      - name: Syntax/Struktur prüfen
        run: npm run check

      - name: Typen prüfen
        run: npm run test:types

      - name: Übersetzungen prüfen
        run: npm run test:i18n

      - name: Lint
        run: npm run test:lint

      - name: App-Features
        run: npm run test:app-features

      - name: Champion-Rahmen
        run: node tools/champion-frames-test.js

      - name: Bundle-Budget
        run: npm run test:bundle

      - name: Installer-Datenerhalt
        run: npm run test:installer

      - name: Installer-Upgrade (NSIS-Code + Migration)
        run: node tools/installer-upgrade-test.js

      - name: Daten-Migration
        run: npm run test:migration

      - name: Icon-Cache
        run: npm run test:icons

      - name: Startup-Budget
        run: npm run test:perf

      - name: Stream-Deck-Plugin
        run: npm run test:plugin

      - name: SBOM erzeugen
        run: npm run sbom

      - name: SBOM hochladen
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

      - name: OAuth-Tests (Fake-Bungie)
        run: npm run test:oauth

      - name: Konfigurations-Persistenz
        run: npm run test:config

      - name: Smoke-Test
        run: npm run smoke

      - name: E2E (Standard-Edition)
        run: npm run e2e
        env:
          D2_E2E_SKIP_LE: "1"

      - name: Veröffentlichungs-Prüfung (nur Standard-Edition)
        run: npm run release:check

      - name: Build (portable + Installer)
        if: github.event_name == 'workflow_dispatch'
        run: npm run dist

      - name: Installer-Upgrade (echtes Setup)
        if: github.event_name == 'workflow_dispatch'
        run: node tools/installer-upgrade-test.js --real
