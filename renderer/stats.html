<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https://www.bungie.net data:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Stat-HUD</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 12px "Segoe UI", system-ui, sans-serif; color: #e8ecf2; user-select: none; }
    #hud { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #3a2228; border-radius: 12px; background: rgba(10, 8, 10, 0.92); box-shadow: 0 10px 34px rgba(0,0,0,0.6); overflow: hidden; }
    header { -webkit-app-region: drag; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: linear-gradient(180deg, #1b1114, #120c0e); border-bottom: 1px solid #3a2228; }
    header strong { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
    #power { color: #f5d76a; font-weight: 700; margin-left: auto; }
    nav { -webkit-app-region: no-drag; display: flex; gap: 3px; }
    nav button { width: 20px; height: 20px; border: 1px solid #452229; border-radius: 5px; background: #140d10; color: #cbbfc2; font-size: 11px; cursor: pointer; padding: 0; }
    nav button:hover { border-color: #ff4655; color: #fff; }
    #stats { display: flex; flex-direction: column; gap: 4px; padding: 7px 9px 4px; flex: 1; justify-content: center; }
    .row { display: grid; grid-template-columns: 16px 1fr auto 92px; align-items: center; gap: 6px; }
    .row img { width: 14px; height: 14px; filter: brightness(1.7); }
    .row .label { color: #a9b7c9; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row b { color: #f0f3f8; font-size: 12px; min-width: 24px; text-align: right; }

    .meter { position: relative; height: 7px; border-radius: 4px; background: #131c28; box-shadow: inset 0 0 0 1px #223043; overflow: hidden; }
    .meter .base { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #3f7fbe, #6cb4f5); }

    .hint { padding: 0 9px 6px; color: #6d7a8c; font-size: 8.5px; text-align: center; }
    .context { display: flex; flex-direction: column; gap: 2px; padding: 0 9px 4px; font-size: 9.5px; color: #9fb0c8; }
    .context .activity { color: #cfe3ff; font-weight: 600; }
    .context .champions { color: #f0b35a; }
  </style>
</head>
<body>
  <div id="hud">
    <header>
      <strong id="charName">Hüter</strong>
      <span id="power"></span>
      <nav>
        <button id="prev" title="Vorheriger Charakter">‹</button>
        <button id="next" title="Nächster Charakter">›</button>
        <button id="close" title="Schließen">✕</button>
      </nav>
    </header>
    <div id="stats"></div>
    <div id="context" class="context" hidden></div>
    <div class="hint">0–200 · DIM/Bungie-Standard</div>
  </div>
  <script src="js/i18n-en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="stats.js"></script>
</body>
</html>
